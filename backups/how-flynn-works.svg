<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" font-family="&#39;Geist&#39;, system-ui, sans-serif" role="img" aria-label="How Flynn works: a centrifugal pump with an embedded MCU running Flynn streams vibration and current telemetry into Flynn, whose verdict is routed to a technician, a dashboard, and a PLC controller, which feeds a real-time action back to the pump in a closed loop.">
  <title>How Flynn Works — signal flow</title>
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 H0 V46" fill="none" stroke="rgba(120,180,210,0.09)" stroke-width="1"></path>
    </pattern>
    <radialGradient id="topGlow" cx="50%" cy="-10%" r="75%">
      <stop offset="0%" stop-color="rgba(34,70,98,0.30)"></stop>
      <stop offset="60%" stop-color="rgba(34,70,98,0)"></stop>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(244,239,230,0.06)"></stop>
      <stop offset="100%" stop-color="rgba(244,239,230,0.035)"></stop>
    </linearGradient>
    <radialGradient id="flynnGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="rgba(79,214,232,0.22)"></stop>
      <stop offset="70%" stop-color="rgba(79,214,232,0.03)"></stop>
    </radialGradient>
    <marker id="ar-cy" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4fd6e8"></path></marker>
    <marker id="ar-am" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ff9d3c"></path></marker>
    
  </defs>

  
  <rect width="1180" height="660" fill="#0a0d12"></rect>
  <rect width="1180" height="660" fill="url(#grid)"></rect>
  <rect width="1180" height="660" fill="url(#topGlow)"></rect>

  
  
  <g>
    <path d="M196 332 H466" fill="none" stroke="#4fd6e8" stroke-width="2.5" opacity="0.18"></path>
    <path d="M196 332 H466" fill="none" stroke="#4fd6e8" stroke-width="2.5" class="flow" marker-end="url(#ar-cy)"></path>
    <circle class="pkt" r="3.5" fill="#4fd6e8"></circle>
  </g>
  
  <g>
    <path d="M632 332 C726 332 742 150 826 150" fill="none" stroke="#4fd6e8" stroke-width="2.5" opacity="0.18"></path>
    <path d="M632 332 C726 332 742 150 826 150" fill="none" stroke="#4fd6e8" stroke-width="2.5" class="flow" marker-end="url(#ar-cy)"></path>
    <circle class="pkt" r="3.5" fill="#4fd6e8"></circle>
  </g>
  
  <g>
    <path d="M642 332 H826" fill="none" stroke="#4fd6e8" stroke-width="2.5" opacity="0.18"></path>
    <path d="M642 332 H826" fill="none" stroke="#4fd6e8" stroke-width="2.5" class="flow" marker-end="url(#ar-cy)"></path>
    <circle class="pkt" r="3.5" fill="#4fd6e8"></circle>
  </g>
  
  <g>
    <path d="M632 332 C726 332 742 527 826 527" fill="none" stroke="#4fd6e8" stroke-width="2.5" opacity="0.18"></path>
    <path d="M632 332 C726 332 742 527 826 527" fill="none" stroke="#4fd6e8" stroke-width="2.5" class="flow" marker-end="url(#ar-cy)"></path>
    <circle class="pkt" r="3.5" fill="#4fd6e8"></circle>
  </g>
  
  <g>
    <path d="M992 566 C992 612 992 624 940 624 H156 C118 624 110 600 110 560 L110 446" fill="none" stroke="#ff9d3c" stroke-width="2.5" opacity="0.18"></path>
    <path d="M992 566 C992 612 992 624 940 624 H156 C118 624 110 600 110 560 L110 446" fill="none" stroke="#ff9d3c" stroke-width="2.5" class="flow-am" marker-end="url(#ar-am)"></path>
    <circle class="pkt" r="3.5" fill="#ff9d3c"></circle>
  </g>

  
  <text class="tag" x="250" y="303" fill="#4fd6e8">VIBRATION · CURRENT · 1 kHz</text>
  <text class="tag" x="250" y="365" fill="#8a857a">raw telemetry →</text>
  <text class="tag" x="360" y="603" fill="#ff9d3c">REAL-TIME ACTION · CLOSED LOOP</text>

  
  <g>
    <rect x="26" y="232" width="168" height="200" rx="12" fill="url(#panelGrad)" stroke="rgba(244,239,230,0.12)"></rect>
    <text class="tag" x="40" y="254">CENTRIFUGAL PUMP</text>
    <circle class="pulse" cx="176" cy="250" r="3.5" fill="#4fd6e8"></circle>
    <circle cx="176" cy="250" r="6.5" fill="none" stroke="rgba(79,214,232,0.18)" stroke-width="3"></circle>
    
    <g transform="translate(40,266)">
      <circle cx="56" cy="52" r="34" fill="none" stroke="#d8d2c5" stroke-width="2.5"></circle>
      <circle cx="56" cy="52" r="7" fill="#4fd6e8"></circle>
      <g stroke="#8a857a" stroke-width="2">
        <line x1="56" y1="52" x2="56" y2="26"></line>
        <line x1="56" y1="52" x2="79" y2="65"></line>
        <line x1="56" y1="52" x2="33" y2="65"></line>
      </g>
      <path d="M86 38 h24 v-12 h22 v52 h-22 v-12 h-24" fill="none" stroke="#d8d2c5" stroke-width="2.5"></path>
      <rect x="6" y="44" width="14" height="16" fill="#8a857a"></rect>
    </g>
    
    <rect x="40" y="376" width="140" height="42" rx="7" fill="rgba(79,214,232,0.06)" stroke="rgba(244,239,230,0.12)"></rect>
    <rect x="50" y="388" width="18" height="18" rx="4" fill="none" stroke="#2a9fb5"></rect>
    <rect x="55" y="393" width="8" height="8" rx="1" fill="#4fd6e8"></rect>
    <text class="mono" x="76" y="393" font-size="11" fill="#d8d2c5">MCU · Flynn</text>
    <text class="mono" x="76" y="406" font-size="9.5" letter-spacing="0.8" fill="#8a857a">8,480 B · BARE-METAL</text>
  </g>

  
  <g>
    <rect x="476" y="252" width="160" height="160" rx="18" fill="url(#flynnGlow)" stroke="rgba(79,214,232,0.40)"></rect>
    <text x="556" y="332" text-anchor="middle" font-weight="600" font-size="24" letter-spacing="-0.5" fill="#f4efe6">FLYNN</text>
    <circle class="pulse" cx="516" cy="352" r="3.5" fill="#4fd6e8"></circle>
    <text class="tag" x="528" y="356" fill="#8a857a">BASELINE LOCKED</text>
  </g>

  
  <g>
    <rect x="826" y="70" width="320" height="134" rx="12" fill="url(#panelGrad)" stroke="rgba(244,239,230,0.12)"></rect>
    <path transform="translate(840,84)" d="M11 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4 0-7 2-7 5v2h14v-2c0-3-3-5-7-5Z" fill="#4fd6e8"></path>
    <text x="872" y="96" font-weight="600" font-size="15" letter-spacing="-0.2" fill="#f4efe6">Technician</text>
    <text class="tag" x="872" y="110">SMS / PUSH ALERT</text>
    <rect x="840" y="124" width="292" height="66" rx="8" fill="rgba(255,157,60,0.07)" stroke="rgba(255,157,60,0.16)"></rect>
    <circle cx="854" cy="142" r="3.5" fill="#ff9d3c"></circle>
    <text class="mono" x="864" y="146" font-size="11" fill="#ff9d3c">FLYNN ALERT</text>
    <text x="854" y="164" font-size="12.5" fill="#d8d2c5">Pump 7B — bearing signature drifting.</text>
    <text x="854" y="180" font-size="12.5" fill="#d8d2c5">17-day window. Schedule swap.</text>
  </g>

  
  <g>
    <rect x="826" y="252" width="320" height="130" rx="12" fill="url(#panelGrad)" stroke="rgba(244,239,230,0.12)"></rect>
    <path transform="translate(840,266)" d="M3 4h7v7H3V4Zm9 0h7v4h-7V4ZM3 13h7v4H3v-4Zm9-2h7v6h-7v-6Z" fill="#4fd6e8"></path>
    <text x="872" y="278" font-weight="600" font-size="15" letter-spacing="-0.2" fill="#f4efe6">Dashboard</text>
    <text class="tag" x="872" y="292">SCADA / MONITORING</text>
    <rect x="840" y="306" width="292" height="62" rx="8" fill="rgba(0,0,0,0.25)" stroke="rgba(244,239,230,0.12)"></rect>
    <line x1="852" y1="344" x2="1120" y2="344" stroke="rgba(79,214,232,0.4)" stroke-width="1" stroke-dasharray="3 4"></line>
    <path d="M852 345 q15 -3 30 0 t30 1 t30 -3 t30 1 t30 0 t30 -12 t28 -22" fill="none" stroke="#ff9d3c" stroke-width="2"></path>
    <circle cx="1112" cy="320" r="3" fill="#ff9d3c"></circle>
    <text class="mono" x="852" y="361" font-size="10" fill="#8a857a">HEALTH</text>
    <text class="mono" x="1120" y="361" font-size="10" text-anchor="end" fill="#ff9d3c">0.61σ → ALERT</text>
  </g>

  
  <g>
    <rect x="826" y="452" width="320" height="122" rx="12" fill="url(#panelGrad)" stroke="rgba(244,239,230,0.12)"></rect>
    <path transform="translate(840,466)" d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm2 4v3h3V7H7Zm0 5v3h3v-3H7Zm5-5v3h5V7h-5Z" fill="#4fd6e8"></path>
    <text x="872" y="478" font-weight="600" font-size="15" letter-spacing="-0.2" fill="#f4efe6">PLC / controller</text>
    <text class="tag" x="872" y="492">AUTOMATED ACTION</text>
    <rect x="840" y="506" width="292" height="54" rx="8" fill="rgba(255,157,60,0.07)" stroke="rgba(255,157,60,0.16)"></rect>
    <text class="mono" x="854" y="528" font-size="11" fill="#ff9d3c">&gt; CMD: throttle 100% → 60%</text>
    <text class="mono" x="854" y="546" font-size="11" fill="#d8d2c5">&gt; derate &amp; flag for service</text>
  </g>
</svg>