name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Link & local-asset check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}"
            --exclude 'https?://inlikeflynn\.io'
            --exclude-path './legacy_files'
            './*.html'
            './pages/**/*.html'
          fail: true

      - name: Cache-version consistency
        shell: bash
        run: |
          set -euo pipefail
          # The deployed surface is the repo root; legacy_files/ is not served
          # and keeps its own tags.
          tags=$(grep -rhoE '\?v=[0-9]{8}-[0-9]{4}' --include='*.html' --exclude-dir=legacy_files . | sort -u || true)
          count=$(printf '%s\n' "$tags" | grep -c . || true)
          echo "Found cache tags:"; printf '%s\n' "$tags"
          if [ "$count" -ne 1 ]; then
            echo "::error::Asset cache (?v=) tags are not uniform across HTML — run the cache-bump pass."
            exit 1
          fi

      - name: No dead placeholder links
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE 'href="#"' --include='*.html' --exclude-dir=legacy_files .; then
            echo "::error::Found dead href=\"#\" links."
            exit 1
          fi
          echo "No dead placeholder links."
