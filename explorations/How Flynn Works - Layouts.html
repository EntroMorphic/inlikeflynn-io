<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>How Flynn Works — diagram layout directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #0c0a07; }

  /* ---- diagram tokens (scoped to .stage) ---- */
  .stage {
    --bone: #14110d;
    --panel: rgba(244,239,230,0.035);
    --panel-2: rgba(244,239,230,0.06);
    --ink: #f4efe6;
    --ink-2: #d8d2c5;
    --mid: #8a857a;
    --hair: rgba(244,239,230,0.12);
    --hair-soft: rgba(120,180,210,0.09);
    --cyan: #4fd6e8;
    --cyan-deep: #2a9fb5;
    --amber: #ff9d3c;
    --amber-soft: rgba(255,157,60,0.16);
    --font: "Geist", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
    position: relative;
    overflow: hidden;
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(34,70,98,0.30), transparent 60%),
      linear-gradient(var(--hair-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--hair-soft) 1px, transparent 1px),
      #0a0d12;
    background-size: auto, 46px 46px, 46px 46px, auto;
  }
  .stage * { box-sizing: border-box; }

  .stage .connectors { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .stage .node { position: absolute; }

  /* flowing dashed signal */
  .flow { stroke-dasharray: 5 9; animation: flowmove 0.9s linear infinite; }
  @keyframes flowmove { to { stroke-dashoffset: -14; } }
  .flow-amber { stroke-dasharray: 5 9; animation: flowmove 0.7s linear infinite; }

  @media (prefers-reduced-motion: reduce) {
    .flow, .flow-amber { animation: none; }
  }

  /* ---- shared node chrome ---- */
  .card {
    border: 1px solid var(--hair);
    border-radius: 12px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    backdrop-filter: blur(2px);
  }
  .tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--mid);
  }
  .led { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 3px rgba(79,214,232,0.18); display: inline-block; }
  .led.amber { background: var(--amber); box-shadow: 0 0 0 3px rgba(255,157,60,0.2); }
  .mono { font-family: var(--mono); }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="hfw-shared.jsx"></script>
<script type="text/babel" src="hfw-directions.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const { DirA, DirB, DirC } = window;
  ReactDOM.createRoot(document.getElementById('root')).render(
    <DesignCanvas>
      <DCSection id="hfw" title="How Flynn Works — diagram layouts" subtitle="3 spatial compositions · cyan = healthy signal, amber = Flynn's detection/action · pump + MCU → Flynn → human / dashboard / PLC → closed loop back to the pump">
        <DCArtboard id="a" label="A · Horizontal Pipeline — process-flow, left to right" width={1180} height={660}><DirA /></DCArtboard>
        <DCArtboard id="b" label="B · Radial Hub — Flynn as the brain at the center" width={1100} height={980}><DirB /></DCArtboard>
        <DCArtboard id="c" label="C · Vertical Descent — scroll-native, top to bottom" width={760} height={1320}><DirC /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
</script>
</body>
</html>
